name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_NEON_URL: https://ep-lingering-art-be1v5oyp.neonauth.c-9.us-east-2.aws.neon.tech/neondb/auth
      VITE_NEON_AUTH_URL: https://ep-lingering-art-be1v5oyp.neonauth.c-9.us-east-2.aws.neon.tech/neondb/auth
      VITE_NEON_DATA_API_URL: https://ep-lingering-art-be1v5oyp.apirest.c-9.us-east-2.aws.neon.tech/neondb/rest/v1
      VITE_AI_API_URL: https://biasharapilot.vercel.app/api/ai

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: biasharapilot-ai-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
